name: Settle tickets and publish the board

# The one writer of two things (README.md § Why this is its own repository):
#   1. `ticket.mjs settle` — every ticket in `review` follows its code PR: merged →
#      `done` (and its QUEUE line goes), closed unmerged → back to `open`.
#   2. the `board` branch — tickets.json + BOARD.md, generated by `ticket.mjs board` and
#      force-pushed, so readers (Manager's 4D Board) never need to generate anything.
# Plus `ticket.mjs check`, so a push that breaks the queue's rules goes red here.
#
# The tool is the code repo's own (kevinrhaas/chicago, chicago/4d/tools/ticket.mjs),
# run against this checkout with CHICAGO_TICKETS_DIR. Both repos are public, so the code
# checkout and the PR reads need no secret; the pushes use this repo's GITHUB_TOKEN.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: settle
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: tickets
          fetch-depth: 0
      - name: Fetch the ticket tool (sparse — chicago/4d/tools only)
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse --branch dev \
            https://github.com/kevinrhaas/chicago.git code
          git -C code sparse-checkout set chicago/4d/tools
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Settle tickets whose PR has merged or closed
        env:
          CHICAGO_TICKETS_DIR: ${{ github.workspace }}/tickets
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git -C tickets config user.name "chicago-tickets settle"
          git -C tickets config user.email "steward@polecat.live"
          node code/chicago/4d/tools/ticket.mjs settle
      - name: Check the queue's rules
        env:
          CHICAGO_TICKETS_DIR: ${{ github.workspace }}/tickets
        run: node code/chicago/4d/tools/ticket.mjs check
      - name: Publish the board branch (tickets.json + BOARD.md)
        if: always()
        env:
          CHICAGO_TICKETS_DIR: ${{ github.workspace }}/tickets
        run: |
          node code/chicago/4d/tools/ticket.mjs board
          rm -rf board && mkdir board && cd board
          git init -q -b board
          cp ../tickets/tickets.json ../tickets/BOARD.md .
          printf '# board\n\nGenerated from main@%s by .github/workflows/settle.yml. Never edit by hand.\n' \
            "$(git -C ../tickets rev-parse --short HEAD)" > README.md
          git add -A
          git -c user.name="chicago-tickets settle" -c user.email="steward@polecat.live" \
            commit -q -m "board: main@$(git -C ../tickets rev-parse --short HEAD)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" board:board
